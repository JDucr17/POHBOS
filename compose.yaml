name: streamline

services:
  postgres:
    image: postgres:17-alpine
    container_name: streamline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - streamline

  redis:
    image: redis/redis-stack:7.4.0-v6
    container_name: streamline-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "${REDIS_INSIGHT_PORT:-8001}:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - streamline

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    container_name: streamline-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "${REDPANDA_HOST_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - streamline

  airflow:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: streamline-airflow:3.3.0
    container_name: streamline-airflow
    restart: unless-stopped
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/streamline/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      KAFKA_BROKERS: "${KAFKA_BROKERS_INTERNAL:-redpanda:9092}"
      KAFKA_BASELINE_SIGNALS_TOPIC: "${KAFKA_BASELINE_SIGNALS_TOPIC:-baseline_signals}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "${AIRFLOW_UI_PORT:-8082}:8080"
    volumes:
      - airflow_data:/opt/airflow
      - analytics_data:/opt/streamline/services/analytics/data
      - ./apps/showcase/public/data:/opt/streamline/apps/showcase/public/data
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - streamline

volumes:
  postgres_data:
    name: streamline_postgres_data
  redis_data:
    name: streamline_redis_data
  redpanda_data:
    name: streamline_redpanda_data
  airflow_data:
    name: streamline_airflow_data
  analytics_data:
    name: streamline_analytics_data

networks:
  streamline:
    name: streamline
    driver: bridge
