[project]
name = "pohbos-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JDucr17", email = "jducr17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dbt-core>=1.12.0",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.4",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
pohbos-analytics = "pohbos_analytics.cli:app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
