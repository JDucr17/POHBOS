[project]
name = "streamline-replay"
version = "0.1.0"
description = "Replay EClog traffic into the Streamline ingestion pipeline."
readme = "README.md"
authors = [
    { name = "JDucr17", email = "jducr17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.5",
    "orjson>=3.11.9",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
eclog-replay = "traffic_replay.cli:app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "traffic_replay"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]